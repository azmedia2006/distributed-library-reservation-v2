    <text x="24" y="112" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#71717a">PHIÊN BẠN ĐỌC</text>
    <circle cx="32" cy="132" r="10" fill="#18181b"/>
    <text x="32" y="135.5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#ffffff">NA</text>
    <text x="48" y="136" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#09090b">Nguyễn Văn An</text>

    <!-- Nav Items -->
