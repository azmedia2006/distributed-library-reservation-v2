      <text x="448" y="47" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#09090b">2</text>
      <text x="472" y="46" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a">1 Reserved · 1 Borrowed</text>

      <text x="664" y="22" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#71717a">Luồng hàng đợi AMQP</text>
