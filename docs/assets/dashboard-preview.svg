      <line x1="0" y1="38" x2="310" y2="38" stroke="#e4e4e7"/>

      <!-- Order 1 -->
      <text x="16" y="60" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#09090b">Building Microservices</text>
      <rect x="224" y="47" width="70" height="19" rx="9.5" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="259" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">Reserved</text>
      <text x="16" y="77" font-family="-apple-system, sans-serif" font-size="10.5" fill="#52525b">Đã xác nhận giữ sách thành công.</text>
      <rect x="16" y="86" width="74" height="22" rx="4" fill="#0f172a"/>
      <text x="53" y="100" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#ffffff">Nhận sách</text>

      <line x1="16" y1="120" x2="294" y2="120" stroke="#f4f4f5"/>

      <!-- Order 2 -->
      <text x="16" y="142" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#09090b">Building Microservices</text>
      <rect x="224" y="129" width="70" height="19" rx="9.5" fill="#fff1f2" stroke="#fecdd3"/>
      <text x="259" y="142" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#be123c">Rejected</text>
      <text x="16" y="159" font-family="-apple-system, sans-serif" font-size="10.5" fill="#52525b">Hết sách khả dụng (Chống Overbooking).</text>
      <text x="16" y="175" font-family="ui-monospace, monospace" font-size="9.5" fill="#71717a">Trace: #8f1d4b20 · 202 Accepted</text>
