<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%" role="img" aria-label="LibraQueue Web Dashboard Preview">
  <defs>
    <linearGradient id="frameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <!-- Outer Showcase Canvas -->
  <rect width="1200" height="560" rx="16" fill="url(#frameBg)"/>

  <!-- Browser Window Frame -->
  <g transform="translate(36, 28)" filter="url(#cardShadow)">
    <rect width="1128" height="504" rx="12" fill="#fafafa" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Browser Chrome Bar -->
    <rect width="1128" height="38" rx="12" fill="#ffffff"/>
    <rect y="26" width="1128" height="12" fill="#ffffff"/>
    <line x1="0" y1="38" x2="1128" y2="38" stroke="#e4e4e7" stroke-width="1"/>
    <circle cx="20" cy="19" r="5" fill="#fda4af"/>
    <circle cx="36" cy="19" r="5" fill="#fcd34d"/>
    <circle cx="52" cy="19" r="5" fill="#6ee7b7"/>
    <rect x="380" y="8" width="368" height="22" rx="5" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
    <text x="564" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#52525b">http://localhost:8088 — LibraQueue Enterprise</text>

    <!-- Left Sidebar -->
    <rect x="0" y="38" width="216" height="466" fill="#ffffff"/>
    <line x1="216" y1="38" x2="216" y2="504" stroke="#e4e4e7" stroke-width="1"/>

