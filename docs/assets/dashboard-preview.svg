    <rect x="978" y="50" width="126" height="26" rx="6" fill="#0f172a"/>
    <text x="1041" y="67" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">+ Nhập đầu sách</text>

    <!-- KPI Strip -->
    <g transform="translate(240, 102)">
      <rect width="864" height="68" rx="9" fill="#ffffff" stroke="#e4e4e7"/>
      <line x1="216" y1="0" x2="216" y2="68" stroke="#e4e4e7"/>
