      <text x="166" y="21" font-family="ui-monospace, monospace" font-size="10.5" fill="#38bdf8">1. POST /reservations</text>
      <text x="308" y="21" font-family="ui-monospace, monospace" font-size="10.5" fill="#64748b">→</text>
      <text x="326" y="21" font-family="ui-monospace, monospace" font-size="10.5" fill="#fb923c">2. RabbitMQ Queue</text>
      <text x="454" y="21" font-family="ui-monospace, monospace" font-size="10.5" fill="#64748b">→</text>
      <text x="472" y="21" font-family="ui-monospace, monospace" font-size="10.5" fill="#a78bfa">3. Worker Serializable Tx</text>
      <text x="638" y="21" font-family="ui-monospace, monospace" font-size="10.5" fill="#64748b">→</text>
      <text x="656" y="21" font-family="ui-monospace, monospace" font-size="10.5" fill="#34d399">4. PostgreSQL Synced</text>
