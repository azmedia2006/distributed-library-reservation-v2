    <text x="26" y="183" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#09090b">Kho sách &amp; Đặt mượn</text>
    <text x="184" y="183" font-family="ui-monospace, monospace" font-size="10" fill="#52525b">5</text>

    <text x="26" y="214" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#52525b">Điều phối quầy thư viện</text>
    <text x="26" y="242" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#52525b">Danh bạ thẻ bạn đọc</text>
    <text x="26" y="270" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#52525b">Tra cứu vận đơn &amp; Trace</text>

    <!-- Sidebar Telemetry Footer -->
    <line x1="14" y1="428" x2="202" y2="428" stroke="#e4e4e7"/>
    <text x="18" y="446" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#71717a">HẠ TẦNG PHÂN TÁN</text>
    <circle cx="23" cy="464" r="3.5" fill="#10b981"/>
    <text x="33" y="468" font-family="-apple-system, sans-serif" font-size="11" fill="#3f3f46">PostgreSQL 16 · Online</text>
    <circle cx="23" cy="484" r="3.5" fill="#10b981"/>
    <text x="33" y="488" font-family="-apple-system, sans-serif" font-size="11" fill="#3f3f46">RabbitMQ AMQP · Online</text>

    <!-- Main Topbar -->
    <rect x="217" y="39" width="910" height="48" fill="#ffffff"/>
    <line x1="216" y1="87" x2="1128" y2="87" stroke="#e4e4e7"/>
