<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490" width="100%" height="100%" role="img" aria-label="Giao diện Web Thư viện Đại học">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1120" height="490" rx="14" fill="#eef2f6"/>

  <!-- Browser Window -->
  <g transform="translate(28, 22)" filter="url(#winShadow)">
    <rect width="1064" height="446" rx="11" fill="#f6f6f4" stroke="#d4d4d8" stroke-width="1"/>

    <!-- Browser Bar -->
    <rect width="1064" height="34" rx="11" fill="#ffffff"/>
    <rect y="22" width="1064" height="12" fill="#ffffff"/>
    <line x1="0" y1="34" x2="1064" y2="34" stroke="#e3e2dd"/>
    <circle cx="18" cy="17" r="4.5" fill="#e4e4e7"/>
    <circle cx="32" cy="17" r="4.5" fill="#e4e4e7"/>
    <circle cx="46" cy="17" r="4.5" fill="#e4e4e7"/>
    <rect x="352" y="7" width="360" height="20" rx="5" fill="#f6f6f4" stroke="#e3e2dd"/>
    <text x="532" y="21" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#52525b">http://localhost:8088</text>

    <!-- App Header -->
    <rect x="1" y="35" width="1062" height="52" fill="#ffffff"/>
    <line x1="0" y1="87" x2="1064" y2="87" stroke="#e3e2dd"/>
    <rect x="28" y="48" width="26" height="26" rx="6" fill="#1e3a8a"/>
    <text x="41" y="65" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">TV</text>
    <text x="64" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#18181b">Thư viện Đại học</text>

    <!-- Horizontal Nav Pills -->
    <rect x="202" y="48" width="114" height="26" rx="5" fill="#f0efec"/>
    <text x="259" y="65" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#18181b">Danh mục sách</text>
    <text x="378" y="65" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#4b5563">Quản lý mượn trả</text>
    <text x="476" y="65" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#4b5563">Bạn đọc</text>
    <text x="568" y="65" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#4b5563">Tra cứu mã phiếu</text>

    <!-- Active Reader Pill & Actions -->
    <rect x="736" y="47" width="144" height="28" rx="14" fill="#f6f6f4" stroke="#e3e2dd"/>
    <circle cx="752" cy="61" r="9" fill="#1e3a8a"/>
    <text x="752" y="64.5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" font-weight="600" fill="#ffffff">NA</text>
    <text x="767" y="65" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#18181b">Nguyễn Văn An</text>

    <rect x="890" y="47" width="146" height="28" rx="6" fill="#18181b"/>
    <text x="963" y="65" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#ffffff">+ Thêm đầu sách</text>

    <!-- Status Subbar -->
    <rect x="1" y="88" width="1062" height="32" fill="#ffffff"/>
    <line x1="0" y1="120" x2="1064" y2="120" stroke="#e3e2dd"/>
    <text x="28" y="108" font-family="-apple-system, sans-serif" font-size="11" fill="#4b5563">5 đầu sách (12 quyển)   |   Sẵn sàng cho mượn: 10 quyển   |   Đang giữ &amp; mượn: 2 phiếu   |   Hàng đợi chờ duyệt: 0</text>
    <circle cx="858" cy="104" r="3.5" fill="#16a34a"/>
    <text x="867" y="108" font-family="-apple-system, sans-serif" font-size="11" fill="#52525b">PostgreSQL: Ổn định</text>
    <circle cx="982" cy="104" r="3.5" fill="#16a34a"/>
    <text x="991" y="108" font-family="-apple-system, sans-serif" font-size="11" fill="#52525b">RabbitMQ</text>

    <!-- Main Two-Column Content -->
    <!-- Left Column: Book Catalog -->
    <g transform="translate(28, 138)">
      <rect width="632" height="288" rx="10" fill="#ffffff" stroke="#e3e2dd"/>
      <text x="18" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#18181b">Tài liệu lưu hành tại thư viện</text>
      <text x="18" y="42" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a">Yêu cầu đặt mượn tiếp nhận qua RabbitMQ và kiểm tra số bản tự động bởi Worker.</text>
      <line x1="0" y1="54" x2="632" y2="54" stroke="#e3e2dd"/>

      <!-- Search Row -->
      <rect x="1" y="55" width="630" height="40" fill="#fafaf8"/>
      <rect x="18" y="62" width="596" height="26" rx="5" fill="#ffffff" stroke="#e3e2dd"/>
      <text x="32" y="79" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a">Tìm theo nhan đề sách, tác giả hoặc mã ISBN...</text>
      <line x1="0" y1="95" x2="632" y2="95" stroke="#e3e2dd"/>

      <!-- Book Row 1 -->
      <rect x="18" y="110" width="44" height="60" rx="4" fill="#eee8dd" stroke="#d6cfc2"/>
      <text x="24" y="154" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#3d3122">Designing Data</text>
      <text x="76" y="124" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#18181b">Designing Data-Intensive Applications</text>
      <text x="76" y="141" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a">Martin Kleppmann  ·  ISBN 978-1449373320</text>
      <text x="76" y="162" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#15803d">Còn 3/3 quyển trên kệ</text>
      <text x="218" y="162" font-family="-apple-system, sans-serif" font-size="11" fill="#4b5563" text-decoration="underline">Xem chi tiết &amp; kho</text>
      <text x="330" y="162" font-family="-apple-system, sans-serif" font-size="11" fill="#4b5563" text-decoration="underline">Gửi nhanh 3 phiếu</text>
      <rect x="506" y="114" width="108" height="30" rx="6" fill="#1d4ed8"/>
      <text x="560" y="133" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#ffffff">Đặt mượn sách</text>

      <line x1="18" y1="186" x2="614" y2="186" stroke="#e3e2dd"/>

      <!-- Book Row 2 -->
      <rect x="18" y="202" width="44" height="60" rx="4" fill="#e2ece9" stroke="#c3d9d2"/>
      <text x="24" y="246" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1b3b32">Building Micro</text>
      <text x="76" y="216" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#18181b">Building Microservices: Fine-Grained Systems</text>
      <text x="76" y="233" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a">Sam Newman  ·  ISBN 978-1492034025</text>
      <text x="76" y="254" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#b91c1c">Tạm hết bản khả dụng (0/1)</text>
      <rect x="478" y="206" width="136" height="30" rx="6" fill="#ffffff" stroke="#e3e2dd"/>
      <text x="546" y="225" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#18181b">Gửi yêu cầu (Hết sách)</text>
    </g>

    <!-- Right Column: Reader Loans -->
    <g transform="translate(680, 138)">
      <rect width="356" height="288" rx="10" fill="#ffffff" stroke="#e3e2dd"/>
      <text x="18" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#18181b">Phiếu đặt &amp; sách đang mượn</text>
      <text x="18" y="42" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a">Nguyễn Văn An · an.nguyen@library.edu.vn</text>
      <line x1="0" y1="54" x2="356" y2="54" stroke="#e3e2dd"/>

      <!-- Loan Item 1 -->
      <text x="18" y="78" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#18181b">Building Microservices</text>
      <rect x="262" y="64" width="76" height="20" rx="10" fill="#dbeafe"/>
      <text x="300" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#1d4ed8">Đã giữ sách</text>
      <text x="18" y="97" font-family="-apple-system, sans-serif" font-size="11" fill="#4b5563">Đã xác nhận giữ sách thành công. Vui lòng nhận sách.</text>
      <rect x="18" y="108" width="114" height="24" rx="5" fill="#1d4ed8"/>
      <text x="75" y="124" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#ffffff">Xác nhận nhận sách</text>
      <rect x="140" y="108" width="64" height="24" rx="5" fill="#fff5f5" stroke="#fecaca"/>
      <text x="172" y="124" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#b91c1c">Hủy đặt</text>

      <line x1="18" y1="146" x2="338" y2="146" stroke="#e3e2dd"/>

      <!-- Loan Item 2 -->
      <text x="18" y="170" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#18181b">Building Microservices</text>
      <rect x="276" y="156" width="62" height="20" rx="10" fill="#fee2e2"/>
      <text x="307" y="170" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#b91c1c">Từ chối</text>
      <text x="18" y="189" font-family="-apple-system, sans-serif" font-size="11" fill="#4b5563">Hết sách khả dụng tại thời điểm xử lý.</text>
      <text x="18" y="208" font-family="ui-monospace, monospace" font-size="10.5" fill="#71717a">Mã phiếu: #4c2bcd30</text>
    </g>
  </g>
</svg>
