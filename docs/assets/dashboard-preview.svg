      <text x="37" y="168" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#a5b4fc">MSRV</text>
      <text x="70" y="150" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#09090b">Building Microservices: Fine-Grained Systems</text>
      <text x="70" y="166" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a">Sam Newman · ISBN 978-1492034025</text>
      <rect x="70" y="176" width="96" height="18" rx="9" fill="#fff1f2"/>
      <text x="118" y="188" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#be123c">Hết bản (0/1)</text>
      <rect x="424" y="140" width="100" height="26" rx="5" fill="#f4f4f5" stroke="#d4d4d8"/>
      <text x="474" y="157" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#18181b">Gửi thử (0 bản)</text>
      <text x="474" y="182" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#52525b">Mô phỏng x3</text>
    </g>

