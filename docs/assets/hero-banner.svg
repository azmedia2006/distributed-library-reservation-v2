<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" role="img" aria-label="LibraQueue Distributed Library Reservation System">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#131c31"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="nodeBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
    <radialGradient id="glowLeft" cx="20%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glowLeft)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glowRight)"/>
  <rect x="1" y="1" width="1198" height="338" rx="17" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Eyebrow Pill -->
  <g transform="translate(64, 44)">
    <rect width="346" height="28" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#10b981"/>
    <text x="28" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" letter-spacing="0.4">ĐỀ TÀI 20 • PHÁT TRIỂN ỨNG DỤNG PHÂN TÁN • v2.2</text>
  </g>

  <!-- Main Title -->
  <text x="64" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="38" font-weight="700" fill="#f8fafc" letter-spacing="-0.8">
    Distributed Library Reservation
  </text>
  <text x="64" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18.5" font-weight="500" fill="url(#accentGrad)">
    Hệ Thống Thư Viện &amp; Đặt Mượn Sách Bất Đồng Bộ Chống Overbooking
  </text>
  <text x="64" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#94a3b8">
    Kiến trúc hướng sự kiện với .NET 10 Minimal API, RabbitMQ Direct Exchange, Dead Letter Queue, Worker Serializable Tx &amp; PostgreSQL 16.
  </text>

  <!-- Visual Pipeline Strip -->
  <g transform="translate(64, 224)">
    <!-- Node 1: Clients -->
    <rect x="0" y="0" width="186" height="72" rx="10" fill="#0f172a" stroke="url(#nodeBorder)" stroke-width="1.2"/>
    <text x="16" y="25" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" fill="#38bdf8">01 · CLIENTS</text>
    <text x="16" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#f1f5f9">Web SPA &amp; CLI</text>
    <text x="16" y="61" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#64748b">Port 8088 · Reverse Proxy</text>

    <!-- Arrow 1 -->
    <path d="M 194 36 L 222 36" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="222,32 230,36 222,40" fill="#64748b"/>

    <!-- Node 2: Minimal API -->
    <rect x="236" y="0" width="204" height="72" rx="10" fill="#0f172a" stroke="url(#nodeBorder)" stroke-width="1.2"/>
    <text x="252" y="25" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" fill="#818cf8">02 · MINIMAL API</text>
    <text x="252" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#f1f5f9">Library.API (.NET 10)</text>
    <text x="252" y="61" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#64748b">202 Accepted · CorrelationId</text>

    <!-- Arrow 2 -->
    <path d="M 448 36 L 476 36" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="476,32 484,36 476,40" fill="#64748b"/>

    <!-- Node 3: RabbitMQ -->
    <rect x="490" y="0" width="206" height="72" rx="10" fill="#0f172a" stroke="url(#nodeBorder)" stroke-width="1.2"/>
    <text x="506" y="25" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" fill="#fb923c">03 · MESSAGE BROKER</text>
    <text x="506" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#f1f5f9">RabbitMQ + DLQ</text>
    <text x="506" y="61" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#64748b">library.exchange · Persistent</text>

    <!-- Arrow 3 -->
    <path d="M 704 36 L 732 36" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="732,32 740,36 732,40" fill="#64748b"/>

    <!-- Node 4: Worker -->
    <rect x="746" y="0" width="194" height="72" rx="10" fill="#0f172a" stroke="url(#nodeBorder)" stroke-width="1.2"/>
    <text x="762" y="25" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" fill="#34d399">04 · CONSUMER</text>
    <text x="762" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#f1f5f9">Library.Worker</text>
    <text x="762" y="61" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#64748b">Idempotent · Retry x3</text>

    <!-- Arrow 4 -->
    <path d="M 948 36 L 972 36" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="972,32 980,36 972,40" fill="#64748b"/>

    <!-- Node 5: PostgreSQL -->
    <rect x="986" y="0" width="86" height="72" rx="10" fill="#0f172a" stroke="url(#nodeBorder)" stroke-width="1.2"/>
    <text x="1000" y="25" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" fill="#2dd4bf">05 · DB</text>
    <text x="1000" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Postgres</text>
    <text x="1000" y="61" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#64748b">:5432</text>
  </g>
</svg>
