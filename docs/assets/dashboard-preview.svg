      <text x="482" y="73" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Đặt mượn</text>
      <text x="482" y="98" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#52525b">Mô phỏng x3</text>

