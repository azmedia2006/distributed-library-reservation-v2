      <text x="70" y="66" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#09090b">Designing Data-Intensive Applications</text>
      <text x="70" y="82" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a">Martin Kleppmann · ISBN 978-1449373320</text>
      <rect x="70" y="92" width="84" height="18" rx="9" fill="#ecfdf5"/>
      <text x="112" y="104" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#047857">Còn 3/3 bản</text>
