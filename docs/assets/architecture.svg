<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" width="100%" height="100%" role="img" aria-label="Sơ đồ kiến trúc hệ thống thư viện phân tán">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1080" height="390" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Docker Network Zone -->
  <rect x="238" y="24" width="816" height="342" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="256" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#64748b">
    Docker Bridge Network (library_network)
  </text>

  <!-- Clients Column (Outside / Edge) -->
  <g transform="translate(28, 76)">
    <rect width="176" height="92" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0f172a">Web Client</text>
    <text x="16" y="45" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1d4ed8">localhost:8088</text>
    <text x="16" y="65" font-family="-apple-system, sans-serif" font-size="11.5" fill="#475569">Giao diện Web &amp;</text>
    <text x="16" y="80" font-family="-apple-system, sans-serif" font-size="11.5" fill="#475569">Internal Reverse Proxy</text>
  </g>

  <g transform="translate(28, 206)">
    <rect width="176" height="84" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0f172a">Console Client</text>
    <text x="16" y="45" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#475569">.NET 10 CLI App</text>
    <text x="16" y="66" font-family="-apple-system, sans-serif" font-size="11.5" fill="#475569">Menu 9 chức năng &amp; Test</text>
  </g>

  <!-- Library API -->
  <g transform="translate(268, 128)">
    <rect width="200" height="114" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#1e3a8a">Library.API</text>
    <text x="16" y="47" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1d4ed8">Port 5005 → 5000</text>
    <line x1="16" y1="58" x2="184" y2="58" stroke="#bfdbfe" stroke-width="1"/>
    <text x="16" y="77" font-family="-apple-system, sans-serif" font-size="11.5" fill="#1e40af">• ASP.NET Core Minimal API</text>
    <text x="16" y="95" font-family="-apple-system, sans-serif" font-size="11.5" fill="#1e40af">• Trả 202 Accepted + Trace ID</text>
  </g>

  <!-- RabbitMQ Broker -->
  <g transform="translate(546, 66)">
    <rect width="218" height="104" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
    <text x="16" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#9a3412">RabbitMQ Broker</text>
    <text x="16" y="45" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#c2410c">Port 5672 / UI 15672</text>
    <line x1="16" y1="55" x2="202" y2="55" stroke="#fed7aa" stroke-width="1"/>
    <text x="16" y="74" font-family="ui-monospace, monospace" font-size="11" fill="#7c2d12">Ex: library.exchange</text>
    <text x="16" y="91" font-family="ui-monospace, monospace" font-size="11" fill="#7c2d12">Q : library.reservations.queue</text>
  </g>

  <!-- Dead Letter Queue -->
  <g transform="translate(832, 66)">
    <rect width="194" height="104" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="16" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#991b1b">Dead Letter Queue</text>
    <text x="16" y="46" font-family="ui-monospace, monospace" font-size="10.5" fill="#b91c1c">library.exchange.dlx</text>
    <line x1="16" y1="56" x2="178" y2="56" stroke="#fecaca" stroke-width="1"/>
    <text x="16" y="75" font-family="-apple-system, sans-serif" font-size="11.5" fill="#7f1d1d">Cô lập gói tin lỗi sau</text>
    <text x="16" y="91" font-family="-apple-system, sans-serif" font-size="11.5" fill="#7f1d1d">3 lần thử lại thất bại</text>
  </g>

  <!-- Reservation Worker -->
  <g transform="translate(816, 222)">
    <rect width="210" height="116" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="16" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#1e3a8a">Library.Worker</text>
    <text x="16" y="45" font-family="ui-monospace, monospace" font-size="11" fill="#1d4ed8">BackgroundService</text>
    <line x1="16" y1="56" x2="194" y2="56" stroke="#bfdbfe" stroke-width="1"/>
    <text x="16" y="75" font-family="-apple-system, sans-serif" font-size="11.5" fill="#1e40af">• Kiểm tra Idempotency</text>
    <text x="16" y="92" font-family="-apple-system, sans-serif" font-size="11.5" fill="#1e40af">• Giao dịch Serializable</text>
    <text x="16" y="108" font-family="-apple-system, sans-serif" font-size="11.5" fill="#1e40af">• Quét bù đơn Pending</text>
  </g>

  <!-- PostgreSQL 16 -->
  <g transform="translate(546, 228)">
    <rect width="218" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
    <text x="16" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#065f46">PostgreSQL 16</text>
    <text x="16" y="45" font-family="ui-monospace, monospace" font-size="11" fill="#047857">library_db (Port 5432)</text>
    <line x1="16" y1="56" x2="202" y2="56" stroke="#a7f3d0" stroke-width="1"/>
    <text x="16" y="75" font-family="-apple-system, sans-serif" font-size="11.5" fill="#064e3b">Bảng: Books, Users,</text>
    <text x="16" y="92" font-family="-apple-system, sans-serif" font-size="11.5" fill="#064e3b">Reservations (+CorrelationId)</text>
  </g>

  <!-- Connectors -->
  <!-- Web -> API -->
  <path d="M 204 122 L 234 122 L 234 166 L 266 166" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- CLI -> API -->
  <path d="M 204 248 L 234 248 L 234 202 L 266 202" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- (1) API -> Postgres -->
  <path d="M 468 214 L 544 268" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="482" y="256" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#334155">1. Lưu Pending</text>

  <!-- (2) API -> RabbitMQ -->
  <path d="M 468 156 L 544 120" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="474" y="126" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#334155">2. Publish AMQP</text>

  <!-- (3) RabbitMQ -> Worker -->
  <path d="M 710 170 L 856 220" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="752" y="208" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#334155">3. Consume</text>

  <!-- Worker -> DLQ -->
  <path d="M 928 222 L 928 172" fill="none" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowWarn)"/>
  <text x="936" y="201" font-family="-apple-system, sans-serif" font-size="10.5" fill="#b91c1c">Quá 3 lần thử</text>

  <!-- (4) Worker -> Postgres -->
  <path d="M 816 284 L 766 284" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="769" y="274" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#334155">4. Duyệt kho</text>
</svg>
