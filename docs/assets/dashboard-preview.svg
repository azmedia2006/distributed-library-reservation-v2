      <text x="815" y="22" font-family="-apple-system, sans-serif" font-size="10" fill="#059669">Đồng bộ</text>
      <text x="664" y="47" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#09090b">6</text>
      <text x="688" y="46" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a">phiếu đã xử lý</text>
