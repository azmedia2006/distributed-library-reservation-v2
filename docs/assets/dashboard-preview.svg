    <text x="29" y="71" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">LQ</text>
    <text x="50" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#09090b">LibraQueue</text>
    <text x="50" y="79" font-family="-apple-system, sans-serif" font-size="10" fill="#71717a">Distributed Library v2.2</text>

    <!-- Reader Box -->
